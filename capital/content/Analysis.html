<script>

const analyze=document.getElementById("analyze");

analyze.onclick=function(){

let home=document.querySelectorAll(".home");

let away=document.querySelectorAll(".away");

let h=0;

let a=0;

home.forEach(x=>{

h+=Number(x.value);

});

away.forEach(x=>{

a+=Number(x.value);

});

document.getElementById("homeScore").innerHTML=h;

document.getElementById("awayScore").innerHTML=a;

let total=h+a;

let confidence=Math.round(Math.abs(h-a)/total*100);

if(total==0){

confidence=0;

}

document.getElementById("confidence").innerHTML=confidence+"%";

if(h>a){

document.getElementById("prediction").innerHTML="🏆 HOME WIN";

}

else if(a>h){

document.getElementById("prediction").innerHTML="✈ AWAY WIN";

}

else{

document.getElementById("prediction").innerHTML="🤝 DRAW";

}

}

document.getElementById("reset").onclick=function(){

location.reload();

}
