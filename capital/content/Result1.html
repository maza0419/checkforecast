<style>

/* =====================================================
   MAIN CONTAINER
===================================================== */

#predictionCounters {

    width:100%;

}


/* =====================================================
   PREDICTION COUNTER
===================================================== */

.prediction-counter {

    width:100%;

    margin:25px 0;

    padding:20px;

    background:#f4f8fb;

    border:2px solid #1565c0;

    border-radius:15px;

    box-shadow:0 4px 12px rgba(0,0,0,.08);

}


/* =====================================================
   HEADER
===================================================== */

.counter-header {

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}


.counter-header h2 {

    margin:0;

    color:#1565c0;

}


/* =====================================================
   INPUT ROW
===================================================== */

.prediction-input-row {

    display:flex;

    gap:15px;

    width:100%;

}


.top-row {

    margin-bottom:20px;

}


.picks-row {

    margin-top:10px;

}


/* =====================================================
   FIELD
===================================================== */

.prediction-field {

    flex:1;

    min-width:0;

}


.prediction-field label {

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:bold;

    color:#333;

}


/* =====================================================
   INPUT
===================================================== */

.prediction-field input {

    width:100%;

    padding:13px;

    border:2px solid #ddd;

    border-radius:9px;

    background:#fff;

    font-size:15px;

    font-weight:bold;

}


/* =====================================================
   SELECT
===================================================== */

.prediction-field select {

    width:100%;

    padding:13px;

    border:2px solid #ddd;

    border-radius:9px;

    background:#fff;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   FOCUS
===================================================== */

.prediction-field input:focus,
.prediction-field select:focus {

    outline:none;

    border-color:#1565c0;

    box-shadow:
        0 0 0 3px
        rgba(21,101,192,.10);

}


/* =====================================================
   SECTION TITLES
===================================================== */

.section-title {

    width:100%;

    text-align:center;

    margin:15px 0;

    padding:12px;

    border-radius:10px;

    font-size:17px;

    letter-spacing:1px;

}


.advantage-title {

    background:#e3f2fd;

    color:#1565c0;

}


.disadvantage-title {

    background:#ffebee;

    color:#c62828;

}


/* =====================================================
   BUTTONS
===================================================== */

.counter-buttons {

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:25px;

}


.save-counter,
.delete-counter,
#addPredictionCounter {

    border:none;

    padding:12px 22px;

    border-radius:9px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


/* SAVE */

.save-counter {

    background:#2e7d32;

    color:white;

}


.save-counter:hover {

    background:#1b5e20;

}


/* DELETE */

.delete-counter {

    background:#d32f2f;

    color:white;

}


.delete-counter:hover {

    background:#b71c1c;

}


/* =====================================================
   ADD COUNTER
===================================================== */

.add-counter-container {

    width:100%;

    text-align:center;

    margin:25px 0 40px;

}


#addPredictionCounter {

    background:#1565c0;

    color:white;

    padding:15px 30px;

    font-size:16px;

}


#addPredictionCounter:hover {

    background:#0d47a1;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    .prediction-input-row {

        flex-direction:column;

        gap:12px;

    }


    .counter-header {

        flex-direction:column;

        gap:10px;

        text-align:center;

    }


    .counter-buttons {

        flex-direction:column;

    }


    .save-counter,
    .delete-counter {

        width:100%;

    }

}

</style>


<script>

/* =====================================================
   ADD NEW PREDICTION COUNTER
===================================================== */

const countersContainer =
    document.getElementById("predictionCounters");

const addButton =
    document.getElementById("addPredictionCounter");


/* =====================================================
   CREATE COUNTER
===================================================== */

addButton.addEventListener("click", function() {

    const firstCounter =
        document.querySelector(".prediction-counter");

    const newCounter =
        firstCounter.cloneNode(true);


    /* Clear text inputs */

    newCounter
        .querySelectorAll("input")
        .forEach(function(input) {

            if(input.type === "number") {

                input.value = "0";

            } else {

                input.value = "";

            }

        });


    /* Reset selects */

    newCounter
        .querySelectorAll("select")
        .forEach(function(select) {

            select.selectedIndex = 0;

        });


    /* Add new counter */

    countersContainer.appendChild(newCounter);


    /* Scroll to new counter */

    newCounter.scrollIntoView({

        behavior:"smooth",

        block:"center"

    });

});


/* =====================================================
   DELETE COUNTER
===================================================== */

document.addEventListener("click", function(event) {

    if(
        event.target.classList.contains("delete-counter")
    ) {

        const counter =
            event.target.closest(".prediction-counter");


        const allCounters =
            document.querySelectorAll(".prediction-counter");


        /* Keep at least one counter */

        if(allCounters.length > 1) {

            counter.remove();

        } else {

            alert(
                "At least one Prediction Counter must remain."
            );

        }

    }

});


/* =====================================================
   SAVE COUNTER
===================================================== */

document.addEventListener("click", function(event) {

    if(
        event.target.classList.contains("save-counter")
    ) {

        const counter =
            event.target.closest(".prediction-counter");


        const name =
            counter.querySelector(".prediction-name").value;


        const score =
            counter.querySelector(".prediction-score").value;


        if(!name) {

            alert("Please enter a Prediction Name.");

            return;

        }


        alert(
            "Prediction Counter saved!\\n\\n" +
            "Prediction: " + name +
            "\\nScore: " + score + "%"
        );

    }

});

</script>
