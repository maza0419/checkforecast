<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Value Capital - Counter</title>

<style>

/* ================================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

/* ================================
   BODY
================================ */

body {
    background: linear-gradient(
        135deg,
        #0f2027,
        #203a43,
        #2c5364
    );

    padding: 10px;
    color: #222;
}

/* ================================
   MAIN CONTAINER
================================ */

.container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,.30);
}

/* ================================
   TITLE
================================ */

h1 {
    text-align: center;
    color: #1565c0;
    font-size: 28px;
    margin-bottom: 18px;
}

/* ================================
   COUNTER ROW
================================ */

.counter-row {

    width: 100%;

    display: flex;

    flex-direction: row;

    align-items: stretch;

    gap: 8px;

    overflow-x: hidden;

    padding: 5px 0 10px;
}

/* ================================
   INPUT CARD
================================ */

.input-card {

    flex: 1 1 0;

    min-width: 0;

    background: #f4f8fb;

    border: 2px solid #d8e0e6;

    border-radius: 9px;

    padding: 10px 6px;

    text-align: center;

    transition: .2s;
}

.input-card:hover {

    border-color: #1565c0;

    transform: translateY(-1px);
}

/* ================================
   LABEL
================================ */

.input-label {

    display: block;

    width: 100%;

    font-size: 12px;

    font-weight: bold;

    color: #1565c0;

    margin-bottom: 8px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* ================================
   NUMBER INPUT
================================ */

.input-card input {

    width: 100%;

    max-width: 80px;

    padding: 8px 3px;

    border: 1px solid #ccc;

    border-radius: 6px;

    background: #fff;

    font-size: 14px;

    font-weight: bold;

    text-align: center;
}

.input-card input:focus {

    outline: none;

    border-color: #1565c0;

    box-shadow: 0 0 0 2px rgba(21,101,192,.10);
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 900px) {

    .container {
        padding: 15px;
    }

    .input-label {
        font-size: 11px;
    }

}


/* =====================================================
   ANDROID PHONES
   600px AND BELOW
===================================================== */

@media (max-width: 600px) {

    body {
        padding: 4px;
    }

    .container {

        padding: 10px;

        border-radius: 10px;
    }

    h1 {

        font-size: 21px;

        margin-bottom: 10px;
    }

    .counter-row {

        gap: 4px;

        padding: 2px 0 6px;
    }

    .input-card {

        padding: 7px 2px;

        border-width: 1px;

        border-radius: 6px;
    }

    .input-label {

        font-size: 9px;

        margin-bottom: 5px;

        white-space: normal;

        line-height: 1.1;

        min-height: 20px;

        display: flex;

        align-items: center;

        justify-content: center;
    }

    .input-card input {

        width: 100%;

        padding: 6px 1px;

        font-size: 12px;

        border-radius: 5px;
    }

}


/* =====================================================
   360–390px ANDROID
===================================================== */

@media (max-width: 390px) {

    body {
        padding: 2px;
    }

    .container {

        padding: 7px;

        border-radius: 8px;
    }

    h1 {

        font-size: 18px;

        margin-bottom: 8px;
    }

    .counter-row {

        width: 100%;

        display: flex;

        flex-direction: row;

        gap: 3px;

        overflow: hidden;
    }

    .input-card {

        flex: 1 1 0;

        width: calc((100% - 18px) / 7);

        min-width: 0;

        padding: 6px 1px;

        border-radius: 5px;
    }

    .input-label {

        font-size: 7px;

        line-height: 1.05;

        min-height: 22px;

        margin-bottom: 4px;

        white-space: normal;

        overflow: visible;

        text-overflow: clip;
    }

    .input-card input {

        width: 100%;

        min-width: 0;

        padding: 5px 0;

        font-size: 10px;

        border-radius: 4px;
    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 360px) {

    .container {
        padding: 5px;
    }

    h1 {
        font-size: 17px;
    }

    .counter-row {
        gap: 2px;
    }

    .input-card {
        width: calc((100% - 12px) / 7);
        padding: 5px 1px;
    }

    .input-label {
        font-size: 6.5px;
        min-height: 20px;
    }

    .input-card input {
        padding: 4px 0;
        font-size: 9px;
    }

}

</style>

</head>


<body>


<div class="container">


<h1>⚽ Counter</h1>


<div class="counter-row">


<!-- WINS -->

<div class="input-card">

<label class="input-label">
🏆 Wins
</label>

<input
    type="number"
    id="wins"
    min="0"
    value="0">

</div>


<!-- DRAWS -->

<div class="input-card">

<label class="input-label">
🤝 Draw
</label>

<input
    type="number"
    id="draws"
    min="0"
    value="0">

</div>


<!-- LOSSES -->

<div class="input-card">

<label class="input-label">
❌ Losses
</label>

<input
    type="number"
    id="losses"
    min="0"
    value="0">

</div>


<!-- OVER 1.5 -->

<div class="input-card">

<label class="input-label">
⚽ Over 1.5
</label>

<input
    type="number"
    id="over15"
    min="0"
    value="0">

</div>


<!-- 1–4 GOALS -->

<div class="input-card">

<label class="input-label">
🎯 1–4 Goals
</label>

<input
    type="number"
    id="goals14"
    min="0"
    value="0">

</div>


<!-- ATTACK -->

<div class="input-card">

<label class="input-label">
⚔️ Attack
</label>

<input
    type="number"
    id="attackScored"
    min="0"
    value="0">

</div>


<!-- DEFENCE -->

<div class="input-card">

<label class="input-label">
🛡️ Defence
</label>

<input
    type="number"
    id="defenceSuccess"
    min="0"
    value="0">

</div>


</div>


</div>


</body>

</html>
```
