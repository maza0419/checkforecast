<style>

/* =========================================================
   MAIN CONTAINER
========================================================= */

.prediction-counter-container {

    width:100%;
    margin:20px 0;

}


/* =========================================================
   INPUT BOX
========================================================= */

.prediction-input-box {

    width:100%;

    padding:20px;

    background:#f4f8fb;

    border:2px solid #1565c0;

    border-radius:15px;

    box-sizing:border-box;

}


/* =========================================================
   TITLE
========================================================= */

.prediction-input-box h2 {

    text-align:center;

    color:#1565c0;

    margin:0 0 20px 0;

    font-size:24px;

}


/* =========================================================
   ROW
========================================================= */

.prediction-input-row {

    display:flex;

    gap:15px;

    width:100%;

    box-sizing:border-box;

}


.top-row {

    margin-bottom:20px;

}


.picks-row {

    margin-top:10px;

    margin-bottom:20px;

}


/* =========================================================
   SECTION TITLES
========================================================= */

.section-title {

    width:100%;

    text-align:center;

    padding:12px;

    border-radius:10px;

    margin:15px 0;

    font-size:18px;

    letter-spacing:1px;

    box-sizing:border-box;

}


/* ADVANTAGE */

.advantage-title {

    background:#e3f2fd;

    color:#1565c0;

    border:1px solid #90caf9;

}


/* DISADVANTAGE */

.disadvantage-title {

    background:#ffebee;

    color:#c62828;

    border:1px solid #ef9a9a;

}


/* =========================================================
   FIELD
========================================================= */

.prediction-field {

    flex:1;

    min-width:0;

}


/* =========================================================
   LABEL
========================================================= */

.prediction-field label {

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:bold;

    color:#333;

}


/* =========================================================
   INPUT
========================================================= */

.prediction-field input {

    width:100%;

    padding:13px;

    border:2px solid #ddd;

    border-radius:9px;

    background:#fff;

    font-size:15px;

    font-weight:bold;

    box-sizing:border-box;

}


/* =========================================================
   SELECT
========================================================= */

.prediction-field select {

    width:100%;

    padding:13px;

    border:2px solid #ddd;

    border-radius:9px;

    background:#fff;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    box-sizing:border-box;

}


/* =========================================================
   FOCUS
========================================================= */

.prediction-field input:focus,
.prediction-field select:focus {

    outline:none;

    border-color:#1565c0;

    box-shadow:
        0 0 0 3px
        rgba(21,101,192,.10);

}


/* =========================================================
   BUTTON AREA
========================================================= */

.prediction-buttons {

    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:25px;

    padding-top:20px;

    border-top:1px solid #ddd;

}


/* =========================================================
   BUTTON
========================================================= */

.prediction-btn {

    border:none;

    padding:13px 25px;

    border-radius:9px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


/* ADD */

.add-btn {

    background:#1565c0;

    color:white;

}


.add-btn:hover {

    background:#0d47a1;

    transform:translateY(-1px);

}


/* DELETE */

.delete-btn {

    background:#e53935;

    color:white;

}


.delete-btn:hover {

    background:#b71c1c;

    transform:translateY(-1px);

}


/* SAVE */

.save-btn {

    background:#2e7d32;

    color:white;

}


.save-btn:hover {

    background:#1b5e20;

    transform:translateY(-1px);

}


/* =========================================================
   STATUS
========================================================= */

.prediction-status {

    text-align:center;

    margin-top:15px;

    font-size:14px;

    font-weight:bold;

    min-height:20px;

}


/* =========================================================
   SAVED PREDICTIONS
========================================================= */

.saved-predictions {

    width:100%;

    margin-top:20px;

}


/* =========================================================
   SAVED CARD
========================================================= */

.saved-prediction-card {

    background:#fff;

    border:2px solid #ddd;

    border-radius:12px;

    padding:18px;

    margin-bottom:15px;

    box-shadow:
        0 3px 10px rgba(0,0,0,.06);

}


.saved-prediction-card h3 {

    margin:0 0 8px 0;

    color:#1565c0;

}


.saved-score {

    font-size:18px;

    font-weight:bold;

    margin-bottom:15px;

}


/* =========================================================
   SAVED PICK SECTIONS
========================================================= */

.saved-section {

    margin-top:12px;

}


.saved-section-title {

    font-weight:bold;

    margin-bottom:8px;

}


.saved-advantage {

    color:#1565c0;

}


.saved-disadvantage {

    color:#c62828;

}


.saved-picks {

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}


.saved-pick {

    padding:7px 10px;

    border-radius:7px;

    background:#f4f4f4;

    font-size:13px;

    font-weight:bold;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    .prediction-input-row {

        flex-direction:column;

        gap:12px;

    }


    .prediction-buttons {

        flex-direction:column;

    }


    .prediction-btn {

        width:100%;

    }


    .saved-picks {

        flex-direction:column;

    }

}

</style>



<script>

/* =========================================================
   PREDICTION COUNTER JAVASCRIPT
========================================================= */


/* ---------------------------------------------------------
   GET ELEMENTS
--------------------------------------------------------- */

const addPredictionBtn =
    document.getElementById("addPrediction");

const deletePredictionBtn =
    document.getElementById("deletePrediction");

const savePredictionBtn =
    document.getElementById("savePrediction");

const savedPredictions =
    document.getElementById("savedPredictions");

const predictionStatus =
    document.getElementById("predictionStatus");


/* ---------------------------------------------------------
   STORAGE KEY
--------------------------------------------------------- */

const STORAGE_KEY =
    "football_prediction_counter";


/* ---------------------------------------------------------
   GET CURRENT FORM DATA
--------------------------------------------------------- */

function getCurrentPrediction() {

    const name =
        document.querySelector(".predictionName").value.trim();

    const score =
        document.querySelector(".predictionScore").value;


    const advantageElements =
        document.querySelectorAll(".advantagePick");

    const disadvantageElements =
        document.querySelectorAll(".disadvantagePick");


    const advantages = [];

    advantageElements.forEach(function(select) {

        if(select.value !== "") {

            advantages.push(select.value);

        }

    });


    const disadvantages = [];

    disadvantageElements.forEach(function(select) {

        if(select.value !== "") {

            disadvantages.push(select.value);

        }

    });


    return {

        id: Date.now(),

        name: name || "Unnamed Prediction",

        score: score || 0,

        advantages: advantages,

        disadvantages: disadvantages

    };

}


/* ---------------------------------------------------------
   ADD PREDICTION
--------------------------------------------------------- */

addPredictionBtn.addEventListener(
    "click",
    function() {

        const prediction =
            getCurrentPrediction();


        displayPrediction(prediction);


        showStatus(
            "Prediction added successfully.",
            "#1565c0"
        );

    }
);


/* ---------------------------------------------------------
   DISPLAY PREDICTION
--------------------------------------------------------- */

function displayPrediction(prediction) {

    const card =
        document.createElement("div");


    card.className =
        "saved-prediction-card";


    card.dataset.id =
        prediction.id;


    /* ---------------------------------------------
       ADVANTAGE HTML
    --------------------------------------------- */

    let advantageHTML = "";


    prediction.advantages.forEach(
        function(pick) {

            advantageHTML +=
                `<span class="saved-pick">
                    ${pick}
                </span>`;

        }
    );


    if(advantageHTML === "") {

        advantageHTML =
            `<span class="saved-pick">
                None selected
            </span>`;

    }


    /* ---------------------------------------------
       DISADVANTAGE HTML
    --------------------------------------------- */

    let disadvantageHTML = "";


    prediction.disadvantages.forEach(
        function(pick) {

            disadvantageHTML +=
                `<span class="saved-pick">
                    ${pick}
                </span>`;

        }
    );


    if(disadvantageHTML === "") {

        disadvantageHTML =
            `<span class="saved-pick">
                None selected
            </span>`;

    }


    /* ---------------------------------------------
       CARD
    --------------------------------------------- */

    card.innerHTML = `

        <h3>
            📊 ${prediction.name}
        </h3>


        <div class="saved-score">
            Score: ${prediction.score}%
        </div>


        <div class="saved-section">

            <div class="saved-section-title saved-advantage">
                ⚡ ADVANTAGE
            </div>

            <div class="saved-picks">
                ${advantageHTML}
            </div>

        </div>


        <div class="saved-section">

            <div class="saved-section-title saved-disadvantage">
                ⚠️ DISADVANTAGE
            </div>

            <div class="saved-picks">
                ${disadvantageHTML}
            </div>

        </div>

    `;


    savedPredictions.appendChild(card);

}


/* ---------------------------------------------------------
   DELETE LAST PREDICTION
--------------------------------------------------------- */

deletePredictionBtn.addEventListener(
    "click",
    function() {

        const cards =
            savedPredictions.querySelectorAll(
                ".saved-prediction-card"
            );


        if(cards.length === 0) {

            showStatus(
                "There is nothing to delete.",
                "#e53935"
            );

            return;

        }


        const lastCard =
            cards[cards.length - 1];


        lastCard.remove();


        showStatus(
            "Last prediction deleted.",
            "#e53935"
        );

    }
);


/* ---------------------------------------------------------
   SAVE ALL PREDICTIONS
--------------------------------------------------------- */

savePredictionBtn.addEventListener(
    "click",
    function() {

        const cards =
            savedPredictions.querySelectorAll(
                ".saved-prediction-card"
            );


        const predictions = [];


        cards.forEach(
            function(card) {

                const name =
                    card.querySelector("h3")
                    .textContent
                    .replace("📊", "")
                    .trim();


                const scoreText =
                    card.querySelector(".saved-score")
                    .textContent;


                const score =
                    scoreText
                    .replace("Score:", "")
                    .replace("%", "")
                    .trim();


                const advantages = [];


                const advantageSection =
                    card.querySelector(
                        ".saved-advantage"
                    );


                if(advantageSection) {

                    const section =
                        advantageSection
                        .parentElement;


                    section
                        .querySelectorAll(
                            ".saved-pick"
                        )
                        .forEach(
                            function(pick) {

                                if(
                                    pick.textContent.trim()
                                    !== "None selected"
                                ) {

                                    advantages.push(
                                        pick.textContent.trim()
                                    );

                                }

                            }
                        );

                }


                const disadvantages = [];


                const disadvantageSection =
                    card.querySelector(
                        ".saved-disadvantage"
                    );


                if(disadvantageSection) {

                    const section =
                        disadvantageSection
                        .parentElement;


                    section
                        .querySelectorAll(
                            ".saved-pick"
                        )
                        .forEach(
                            function(pick) {

                                if(
                                    pick.textContent.trim()
                                    !== "None selected"
                                ) {

                                    disadvantages.push(
                                        pick.textContent.trim()
                                    );

                                }

                            }
                        );

                }


                predictions.push({

                    name:
                        name,

                    score:
                        score,

                    advantages:
                        advantages,

                    disadvantages:
                        disadvantages

                });

            }
        );


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(predictions)
        );


        showStatus(
            "✅ Predictions saved successfully.",
            "#2e7d32"
        );

    }
);


/* ---------------------------------------------------------
   LOAD SAVED DATA
--------------------------------------------------------- */

function loadSavedPredictions() {

    const stored =
        localStorage.getItem(
            STORAGE_KEY
        );


    if(!stored) {

        return;

    }


    try {

        const predictions =
            JSON.parse(stored);


        predictions.forEach(
            function(prediction) {

                displayPrediction({

                    id:Date.now() + Math.random(),

                    name:
                        prediction.name,

                    score:
                        prediction.score,

                    advantages:
                        prediction.advantages || [],

                    disadvantages:
                        prediction.disadvantages || []

                });

            }
        );

    }

    catch(error) {

        console.error(
            "Could not load predictions:",
            error
        );

    }

}


/* ---------------------------------------------------------
   STATUS MESSAGE
--------------------------------------------------------- */

function showStatus(
    message,
    color
) {

    predictionStatus.textContent =
        message;

    predictionStatus.style.color =
        color;


    setTimeout(
        function() {

            predictionStatus.textContent =
                "";

        },
        2500
    );

}


/* ---------------------------------------------------------
   LOAD WHEN PAGE OPENS
--------------------------------------------------------- */

loadSavedPredictions();

</script>
