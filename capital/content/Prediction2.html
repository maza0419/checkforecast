<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Football Value Capital - Team Statistics</title>


<style>

/* =========================
   GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    min-height:100vh;

    padding:20px;

    background:
    linear-gradient(
        135deg,
        #0f2027,
        #203a43,
        #2c5364
    );

}


/* =========================
   MAIN CONTAINER
========================= */

.container{

    max-width:1000px;

    margin:30px auto;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.4);

}


/* =========================
   TITLE
========================= */

h1{

    text-align:center;

    color:#1565C0;

    font-size:34px;

    margin-bottom:10px;

}

.subtitle{

    text-align:center;

    color:#666;

    margin-bottom:25px;

}


/* =========================
   TEAM INFORMATION
========================= */

.team-info{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

    margin-bottom:25px;

}

.team-box{

    padding:20px;

    border-radius:15px;

    text-align:center;

}

.home-team{

    background:#e8f5e9;

    border:3px solid #28a745;

}

.away-team{

    background:#ffebee;

    border:3px solid #dc3545;

}

.team-box h3{

    margin-bottom:12px;

}

.home-team h3{

    color:#28a745;

}

.away-team h3{

    color:#dc3545;

}

.team-box input{

    width:100%;

    padding:12px;

    border:2px solid #ddd;

    border-radius:8px;

    font-size:16px;

    text-align:center;

}

.team-box input:focus{

    outline:none;

    border-color:#1565C0;

}


/* =========================
   TABLE
========================= */

table{

    width:100%;

    border-collapse:collapse;

    overflow:hidden;

    border-radius:12px;

}

thead th{

    padding:16px;

    color:white;

    font-size:18px;

}

thead th:nth-child(1){

    background:#28a745;

}

thead th:nth-child(2){

    background:#1565C0;

}

thead th:nth-child(3){

    background:#dc3545;

}


tbody td{

    padding:13px;

    text-align:center;

    border-bottom:1px solid #ddd;

}

tbody tr:nth-child(even){

    background:#f7f9fa;

}

tbody tr:hover{

    background:#fff8dc;

}


/* =========================
   STATISTIC TITLE
========================= */

.stat-title{

    font-weight:bold;

    color:#333;

    font-size:16px;

}


/* =========================
   SELECT
========================= */

select{

    width:170px;

    padding:10px;

    border:none;

    border-radius:8px;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

}

.home-select{

    background:#28a745;

}

.away-select{

    background:#dc3545;

}

select:hover{

    transform:scale(1.03);

}


/* =========================
   NUMBER INPUT
========================= */

.number-input{

    width:100px;

    padding:9px;

    border:2px solid #ddd;

    border-radius:8px;

    text-align:center;

    font-size:16px;

    font-weight:bold;

}

.number-input:focus{

    outline:none;

    border-color:#1565C0;

}


/* =========================
   BUTTONS
========================= */

.buttons{

    text-align:center;

    margin-top:30px;

}

button{

    padding:14px 30px;

    margin:5px;

    border:none;

    border-radius:10px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}

.analyze{

    background:#1565C0;

}

.reset{

    background:#ff9800;

}

button:hover{

    transform:scale(1.05);

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{

        padding:8px;

    }

    .container{

        padding:15px;

        margin:10px auto;

    }

    h1{

        font-size:25px;

    }

    .team-info{

        grid-template-columns:1fr;

    }

    table{

        min-width:700px;

    }

    .table-wrapper{

        overflow-x:auto;

    }

    thead th{

        font-size:14px;

        padding:10px;

    }

    tbody td{

        padding:9px;

    }

    select{

        width:120px;

        font-size:13px;

    }

}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:400px){

    .container{

        padding:10px;

    }

    h1{

        font-size:22px;

    }

    .team-box{

        padding:15px;

    }

}

</style>

</head>


<body>


<div class="container">


<h1>⚽ Football Value Capital</h1>

<p class="subtitle">
    Team Strength & Match Statistics
</p>


<!-- =========================
     FORM START
========================= -->

<form id="forecastForm" method="POST">

    <!-- Django CSRF -->
    <!-- {% csrf_token %} -->


    <!-- =========================
         TEAM INFORMATION
    ========================= -->

    <div class="team-info">


        <div class="team-box home-team">

            <h3>🏠 Home Team</h3>

            <input
                type="text"
                id="homeTeam"
                name="home_team"
                placeholder="Enter home team"
                required>

        </div>


        <div class="team-box away-team">

            <h3>✈️ Away Team</h3>

            <input
                type="text"
                id="awayTeam"
                name="away_team"
                placeholder="Enter away team"
                required>

        </div>


    </div>



    <!-- =========================
         STATISTICS TABLE
    ========================= -->

    <div class="table-wrapper">

    <table>

        <thead>

            <tr>

                <th>🏠 HOME</th>

                <th>📊 STATISTIC</th>

                <th>✈️ AWAY</th>

            </tr>

        </thead>


        <tbody>


            <!-- FORM -->

            <tr>

                <td>

                    <select
                        class="home-select"
                        name="home_form">

                        <option value="">Rate</option>

                        <option value="100">
                            Elite — 100%
                        </option>

                        <option value="90">
                            Very Strong — 90%
                        </option>

                        <option value="80">
                            Strong — 80%
                        </option>

                        <option value="70">
                            Good — 70%
                        </option>

                        <option value="60">
                            Above Average — 60%
                        </option>

                        <option value="50">
                            Average — 50%
                        </option>

                        <option value="40">
                            Below Average — 40%
                        </option>

                        <option value="30">
                            Weak — 30%
                        </option>

                        <option value="20">
                            Very Weak — 20%
                        </option>

                        <option value="10">
                            Poor — 10%
                        </option>

                        <option value="0">
                            Very Poor — 0%
                        </option>

                    </select>

                </td>


                <td class="stat-title">
                    📈 FORM
                </td>


                <td>

                    <select
                        class="away-select"
                        name="away_form">

                        <option value="">Rate</option>

                        <option value="100">
                            Elite — 100%
                        </option>

                        <option value="90">
                            Very Strong — 90%
                        </option>

                        <option value="80">
                            Strong — 80%
                        </option>

                        <option value="70">
                            Good — 70%
                        </option>

                        <option value="60">
                            Above Average — 60%
                        </option>

                        <option value="50">
                            Average — 50%
                        </option>

                        <option value="40">
                            Below Average — 40%
                        </option>

                        <option value="30">
                            Weak — 30%
                        </option>

                        <option value="20">
                            Very Weak — 20%
                        </option>

                        <option value="10">
                            Poor — 10%
                        </option>

                        <option value="0">
                            Very Poor — 0%
                        </option>

                    </select>

                </td>

            </tr>



            <!-- WINS -->

            <tr>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="home_wins"
                        min="0"
                        value="0">

                </td>

                <td class="stat-title">
                    📈 WINS
                </td>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="away_wins"
                        min="0"
                        value="0">

                </td>

            </tr>



            <!-- DRAWS -->

            <tr>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="home_draws"
                        min="0"
                        value="0">

                </td>

                <td class="stat-title">
                    🤝 DRAWS
                </td>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="away_draws"
                        min="0"
                        value="0">

                </td>

            </tr>



            <!-- LOSSES -->

            <tr>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="home_losses"
                        min="0"
                        value="0">

                </td>

                <td class="stat-title">
                    📉 LOSSES
                </td>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="away_losses"
                        min="0"
                        value="0">

                </td>

            </tr>



            <!-- GOALS CONCEDED -->

            <tr>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="home_goals_against"
                        min="0"
                        value="0">

                </td>

                <td class="stat-title">
                    🥅 GOALS CONCEDED
                </td>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="away_goals_against"
                        min="0"
                        value="0">

                </td>

            </tr>



            <!-- ATTACK -->

            <tr>

                <td>

                    <select
                        class="home-select"
                        name="home_attack">

                        <option value="">Rate</option>
                        <option value="100">Elite — 100%</option>
                        <option value="90">Very Strong — 90%</option>
                        <option value="80">Strong — 80%</option>
                        <option value="70">Good — 70%</option>
                        <option value="60">Above Average — 60%</option>
                        <option value="50">Average — 50%</option>
                        <option value="40">Below Average — 40%</option>
                        <option value="30">Weak — 30%</option>
                        <option value="20">Very Weak — 20%</option>
                        <option value="10">Poor — 10%</option>
                        <option value="0">Very Poor — 0%</option>

                    </select>

                </td>

                <td class="stat-title">
                    ⚔️ ATTACK
                </td>

                <td>

                    <select
                        class="away-select"
                        name="away_attack">

                        <option value="">Rate</option>
                        <option value="100">Elite — 100%</option>
                        <option value="90">Very Strong — 90%</option>
                        <option value="80">Strong — 80%</option>
                        <option value="70">Good — 70%</option>
                        <option value="60">Above Average — 60%</option>
                        <option value="50">Average — 50%</option>
                        <option value="40">Below Average — 40%</option>
                        <option value="30">Weak — 30%</option>
                        <option value="20">Very Weak — 20%</option>
                        <option value="10">Poor — 10%</option>
                        <option value="0">Very Poor — 0%</option>

                    </select>

                </td>

            </tr>



            <!-- DEFENCE -->

            <tr>

                <td>

                    <select
                        class="home-select"
                        name="home_defence">

                        <option value="">Rate</option>
                        <option value="100">Elite — 100%</option>
                        <option value="90">Very Strong — 90%</option>
                        <option value="80">Strong — 80%</option>
                        <option value="70">Good — 70%</option>
                        <option value="60">Above Average — 60%</option>
                        <option value="50">Average — 50%</option>
                        <option value="40">Below Average — 40%</option>
                        <option value="30">Weak — 30%</option>
                        <option value="20">Very Weak — 20%</option>
                        <option value="10">Poor — 10%</option>
                        <option value="0">Very Poor — 0%</option>

                    </select>

                </td>

                <td class="stat-title">
                    🛡️ DEFENCE
                </td>

                <td>

                    <select
                        class="away-select"
                        name="away_defence">

                        <option value="">Rate</option>
                        <option value="100">Elite — 100%</option>
                        <option value="90">Very Strong — 90%</option>
                        <option value="80">Strong — 80%</option>
                        <option value="70">Good — 70%</option>
                        <option value="60">Above Average — 60%</option>
                        <option value="50">Average — 50%</option>
                        <option value="40">Below Average — 40%</option>
                        <option value="30">Weak — 30%</option>
                        <option value="20">Very Weak — 20%</option>
                        <option value="10">Poor — 10%</option>
                        <option value="0">Very Poor — 0%</option>

                    </select>

                </td>

            </tr>



            <!-- OVER 1.5 -->

            <tr>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="home_over_15"
                        min="0"
                        value="0">

                </td>

                <td class="stat-title">
                    ⚽ OVER 1.5
                </td>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="away_over_15"
                        min="0"
                        value="0">

                </td>

            </tr>



            <!-- 1-4 GOALS -->

            <tr>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="home_goals_1_4"
                        min="0"
                        value="0">

                </td>

                <td class="stat-title">
                    🎯 1–4 GOALS
                </td>

                <td>

                    <input
                        type="number"
                        class="number-input"
                        name="away_goals_1_4"
                        min="0"
                        value="0">

                </td>

            </tr>


        </tbody>

    </table>

    </div>


    <!-- =========================
         BUTTONS
    ========================= -->

    <div class="buttons">

        <button
            type="submit"
            class="analyze">

            📊 ANALYZE MATCH

        </button>


        <button
            type="reset"
            class="reset">

            🔄 RESET

        </button>

    </div>


</form>


</div>


</body>

</html>
