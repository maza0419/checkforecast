<script>

/* =========================================================
   PREDICTION COUNTER
========================================================= */

document.addEventListener("DOMContentLoaded", function () {

    const addButton =
        document.getElementById("addPredictionCounter");

    const clearButton =
        document.getElementById("clearPredictionCounter");

    const resultBody =
        document.getElementById("predictionResultBody");

    const counterTotal =
        document.getElementById("counterTotal");


    let counterNumber = 0;


    /* =====================================================
       EMPTY MESSAGE
    ===================================================== */

    function showEmptyMessage() {

        resultBody.innerHTML = `

            <tr>

                <td colspan="12" class="empty-result">

                    No prediction counter added yet.

                    <br>

                    Fill the counter above and click

                    <strong>➕ Add Counter</strong>.

                </td>

            </tr>

        `;

    }


    showEmptyMessage();


    /* =====================================================
       GET VALUE
    ===================================================== */

    function getValue(id) {

        const element =
            document.getElementById(id);

        return element
            ? element.value.trim()
            : "";

    }


    /* =====================================================
       ADD COUNTER
    ===================================================== */

    addButton.addEventListener("click", function () {

        const predictionName =
            getValue("predictionName");

        const predictionScore =
            getValue("predictionScore");


        /* NAME VALIDATION */

        if (!predictionName) {

            alert("Please enter the Prediction Name.");

            document
                .getElementById("predictionName")
                .focus();

            return;

        }


        /* SCORE VALIDATION */

        if (
            predictionScore === "" ||
            Number(predictionScore) < 0 ||
            Number(predictionScore) > 100
        ) {

            alert(
                "Please enter a score between 0 and 100."
            );

            document
                .getElementById("predictionScore")
                .focus();

            return;

        }


        /* REMOVE EMPTY MESSAGE */

        const emptyRow =
            resultBody.querySelector(".empty-result");

        if (emptyRow) {

            resultBody.innerHTML = "";

        }


        counterNumber++;


        /* ADVANTAGE */

        const advantage1 =
            getValue("advantage1");

        const advantage2 =
            getValue("advantage2");

        const advantage3 =
            getValue("advantage3");

        const advantage4 =
            getValue("advantage4");


        /* DISADVANTAGE */

        const disadvantage1 =
            getValue("disadvantage1");

        const disadvantage2 =
            getValue("disadvantage2");

        const disadvantage3 =
            getValue("disadvantage3");

        const disadvantage4 =
            getValue("disadvantage4");


        /* CREATE ROW */

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${counterNumber}</td>

            <td>
                ${escapeHTML(predictionName)}
            </td>

            <td class="result-score">
                ${escapeHTML(predictionScore)}%
            </td>

            <td class="advantage-cell">
                ${displayValue(advantage1)}
            </td>

            <td class="advantage-cell">
                ${displayValue(advantage2)}
            </td>

            <td class="advantage-cell">
                ${displayValue(advantage3)}
            </td>

            <td class="advantage-cell">
                ${displayValue(advantage4)}
            </td>

            <td class="disadvantage-cell">
                ${displayValue(disadvantage1)}
            </td>

            <td class="disadvantage-cell">
                ${displayValue(disadvantage2)}
            </td>

            <td class="disadvantage-cell">
                ${displayValue(disadvantage3)}
            </td>

            <td class="disadvantage-cell">
                ${displayValue(disadvantage4)}
            </td>

            <td>

                <button
                    type="button"
                    class="delete-row-btn"
                >
                    🗑 Delete
                </button>

            </td>

        `;


        /* DELETE */

        row
            .querySelector(".delete-row-btn")
            .addEventListener("click", function () {

                row.remove();

                renumberRows();

                updateCounterTotal();

            });


        resultBody.appendChild(row);


        updateCounterTotal();


        /* SCROLL TO RESULT */

        document
            .querySelector(".prediction-result-box")
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

    });


    /* =====================================================
       CLEAR
    ===================================================== */

    clearButton.addEventListener("click", function () {

        document
            .getElementById("predictionName")
            .value = "";

        document
            .getElementById("predictionScore")
            .value = "0";


        const selects =
            document.querySelectorAll(
                ".prediction-input-box select"
            );


        selects.forEach(function (select) {

            select.value = "";

        });

    });


    /* =====================================================
       UPDATE COUNTER TOTAL
    ===================================================== */

    function updateCounterTotal() {

        const rows =
            resultBody.querySelectorAll(
                "tr:not(:has(.empty-result))"
            );


        const total = rows.length;


        counterTotal.textContent =
            total +
            (total === 1
                ? " Counter"
                : " Counters");

    }


    /* =====================================================
       RENUMBER
    ===================================================== */

    function renumberRows() {

        const rows =
            resultBody.querySelectorAll("tr");


        rows.forEach(function (row, index) {

            const firstCell =
                row.querySelector("td");


            if (firstCell) {

                firstCell.textContent =
                    index + 1;

            }

        });


        counterNumber =
            rows.length;


        if (rows.length === 0) {

            showEmptyMessage();

        }

    }


    /* =====================================================
       DISPLAY VALUE
    ===================================================== */

    function displayValue(value) {

        if (!value) {

            return '<span style="color:#aaa;">—</span>';

        }

        return escapeHTML(value);

    }


    /* =====================================================
       SECURITY
    ===================================================== */

    function escapeHTML(value) {

        return String(value)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }

});

</script>
